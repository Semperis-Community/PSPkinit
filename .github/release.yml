changelog:
  categories:
    - title: Breaking Changes
      labels:
        - breaking-change
        - breaking
    - title: Features
      labels:
        - enhancement
        - feature
    - title: Fixes
      labels:
        - bug
        - bugfix
        - fix
    - title: Documentation
      labels:
        - documentation
        - docs
    - title: CI and Tooling
      labels:
        - ci
        - tooling
        - chore
    - title: Other Changes
      labels:
        - "*"
  exclude:
    labels:
      - skip-changelog

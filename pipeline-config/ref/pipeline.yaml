# Pipeline-level configuration for the release workflow.

# Versioning for pipeline configuration and workflow contract compatibility.
# configVersion tracks schema changes in this file.
# workflowContractVersion tracks compatibility with workflow validation logic.
configVersion: 1.0.0
workflowContractVersion: 1.0.0

# Base name used for the release zip archive and the uploaded artifact.
# The tag name is appended automatically: <releasePackageName>-<tag>.zip
# Omit or leave blank to fall back to the GitHub repository name.
# Optional multi-package output can be configured in pipeline-config/ref/release-packages.yaml.
# When multi-package config is present and releasePackages is non-empty, one archive per
# configured package is generated in addition to default output when singlePackage.enabled=true.
releasePackageName: PSPkinit

# Optional native Windows executable generation for Python projects.
# Set enabled to true after adding the spec and its referenced inputs.
# Empty legacy settings preserve config shape without overriding the spec.
pythonNativeExe:
  enabled: false
  specFile: build/customer-app.spec
  expectedOutputs:
    - customer-app.exe
  entryScript: ''
  oneFile: ''
  name: ''
  additionalArgs: []

# Repository-owned PyInstaller spec example: REPLACE the pythonNativeExe section
# above with this section; do not add a second pythonNativeExe key.
# pythonNativeExe:
#   enabled: true
#   specFile: build/customer-app.spec
#   expectedOutputs:
#     - customer-app.exe
#
# The spec owns entry points, executable names, resources, and bundle layout.
# Remove entryScript, oneFile, and name; omit additionalArgs or leave it empty.
# Input paths are relative to the repository root. Build runs from that root.
# expectedOutputs lists exact paths relative to the generated output directory.
# For a directory bundle, use these expectedOutputs instead:
#     - customer-app/customer-app.exe
#     - customer-app/_internal
# All bundle files are staged under out/python-exe, not only expectedOutputs.
# Use release-packages.yaml packageMode: single or multi-with-default to include
# the bundle in the default archive under python-exe/.

# Optional native Windows executable generation for .NET projects.
# Set enabled to true after adding the project and filesystem publish profile.
# Empty legacy settings preserve config shape without overriding the profile.
dotnetNativeExe:
  enabled: false
  publishProfile: src/CustomerApp/Properties/PublishProfiles/Release.pubxml
  expectedOutputs:
    - CustomerApp.exe
    - appsettings.json
  project: src/CustomerApp/CustomerApp.csproj
  runtime: ''
  selfContained: ''
  singleFile: ''
  name: ''
  additionalArgs: []

# Repository-owned .NET profile example: REPLACE the dotnetNativeExe section
# above with this section; do not add a second dotnetNativeExe key.
# dotnetNativeExe:
#   enabled: true
#   project: src/CustomerApp/CustomerApp.csproj
#   publishProfile: src/CustomerApp/Properties/PublishProfiles/Release.pubxml
#   expectedOutputs:
#     - CustomerApp.exe
#     - appsettings.json
#
# The profile must explicitly select FileSystem publishing through
# PublishProtocol or WebPublishMethod; remote deployment is not supported.
# The profile owns runtime, self-contained, single-file, and other build settings.
# Remove runtime, selfContained, singleFile, and name; additionalArgs must be empty.
# The pipeline owns output paths and stages the entire bundle under out/dotnet-exe.
# expectedOutputs is required and lists exact generated file/directory paths.
# Use packageMode: single or multi-with-default for the default dotnet-exe/ archive
# content. Neither custom mode permits absolute paths, traversal, or wildcards.
# Specifications/profiles execute build code: commit no secrets and use trusted inputs.

# Explicit release versioning policy used when a PR merge to main creates the next tag.
# method: Choose versioning strategy - 'semver' (default) or 'calver'
versioningPolicy:
  # Versioning method: 'semver' for semantic versioning (MAJOR.MINOR.PATCH),
  # or 'calver' for calendar versioning (YYYY.MM.DD.PATCH)
  method: semver

  # Semantic versioning configuration (used when method: semver)
  # initialVersion is used when no existing stable tag exists yet.
  # defaultIncrement applies when no version label override is present on the merged PR.
  # digitPositions defines single-digit slot locations used when composing
  # internal version lookup values for service pack and release stage.
  # labelOverrides let reviewers select major/minor/patch bumps explicitly via PR labels.
  semver:
    initialVersion: 1.0.0
    defaultIncrement: patch
    servicePackDigit: 0
    digitPositions:
      servicePack: 4
      releaseStage: 5
    labelOverrides:
      major:
        - release:major
      minor:
        - release:minor
      patch:
        - release:patch
    # Applied only when no labelOverrides label is present on the merged PR.
    inferredLabelOverrides:
      minor:
        - feature
        - enhancement
      patch:
        - bug
        - error
        - documentation

  # Calendar versioning configuration (used when method: calver)
  # Versions follow format: YYYY.MM.DD.PATCH (e.g., 2026.06.10.0, 2026.06.10.1)
  # Date is set to release date; patch increments for multiple same-day releases.
  # digitPositions defines single-digit slot locations used when composing
  # internal version lookup values for service pack and release stage.
  calver:
    format: "YYYY.MM.DD.PATCH"
    initialVersion: "2026.06.10.0"
    servicePackDigit: 0
    digitPositions:
      servicePack: 4
      releaseStage: 5
    labelOverrides:
      patch:
        - release:patch

# Patterns to detect the release stage from the tag name.
# Evaluated in order; first match wins. No match defaults to "production".
# Stages map to GitHub Environments — create matching environments in
# Settings > Environments to enable required reviewers and environment-scoped secrets.
preReleasePatterns:
  - pattern: '-alpha\.'
    stage: alpha
  - pattern: '-beta\.'
    stage: beta
  - pattern: '-rc\.'
    stage: rc

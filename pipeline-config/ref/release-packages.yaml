# Release archive generation mode:
# - single: create only the default archive from pipeline.yaml.
# - multi: create one archive per releasePackages entry.
# - multi-with-default: create the package archives and the default archive.
packageMode: multi-with-default


# When true, the same file can be included in multiple packages.
# When false, overlapping file ownership fails release packaging.
allowPathOverlaps: false

# Name of the default archive created in single or multi-with-default mode.
singlePackage:
  releasePackageName: PSPkinit

# Optional multi-package output definitions.
# includePaths/excludePaths entries are repository-relative paths.
# includePaths is required and must contain at least one path.
# excludePaths is required and can be an empty list.
releasePackages: []
